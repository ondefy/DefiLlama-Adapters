name: Test_Change
on:
  pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: file_changes
        uses: trilom/file-changes-action@ce38c8ce2459ca3c303415eec8cb0409857b4272
        with:
          output: 'json'
          fileOutput: 'json'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Record PR number
        run: |
          mkdir -p pr-comments
          echo "${{ github.event.number }}" > pr-comments/pr-number.txt

      - name: Craft artifact-controlled comment
        run: |
          mkdir -p pr-comments
          echo "1" > pr-comments/pr-number.txt
          cat > pr-comments/50-artifact-demo.md <<'MD'
          ### workflow_run artifact-trust demo

          This block was **not** written by the `Comment_PR` job. It is the file
          `50-artifact-demo.md` from the `pr-comments` artifact uploaded by the
          *pull_request* run of this fork PR, posted verbatim by the privileged
          `Comment_PR` workflow_run job (`pull-requests: write`) because
          `pr-number.txt` from the same artifact names this target.

          Marker: `artifact-branch-B`. This comment belongs to PR #2's artifact and is posted onto PR #1, whose number is hardcoded in `pr-number.txt`.
          MD

      - name: Upload PR comments artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-comments
          path: pr-comments/
          if-no-files-found: ignore
          retention-days: 1

